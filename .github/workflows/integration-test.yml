name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The (no-test) gate reads the PR's current title.
  pull-requests: read

# One live run at a time — two runs mutating the same tenant is asking for flakes.
concurrency:
  group: jamf-live-tenant
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    # Skip (not fail) on fork PRs — secrets aren't passed to them (NB: repo *vars*
    # ARE exposed to fork PRs, so guard on the head repo, not just the var) —
    # and on repos without the var configured.
    if: >-
      vars.JAMFPRO_INSTANCE_FQDN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      JAMFPRO_INSTANCE_FQDN: ${{ vars.JAMFPRO_INSTANCE_FQDN }}
      JAMFPRO_CLIENT_ID: ${{ secrets.JAMFPRO_CLIENT_ID }}
      JAMFPRO_CLIENT_SECRET: ${{ secrets.JAMFPRO_CLIENT_SECRET }}
    steps:
      # A (no-test) PR title skips the live suite by failing, never by skipping: a skipped required
      # check counts as passed, and this one should block the merge unless an admin bypasses it.
      # The title is read from the API, not the event payload, so a re-run after a retitle sees the new one.
      - name: Fail on a (no-test) PR title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          title=$(gh pr view "$PR_URL" --json title --jq .title)
          if printf '%s\n' "$title" | grep -Eq '^[a-z]+\(no-test\)!?:'; then
            echo "::error::The PR title has the (no-test) scope, so the live suite did not run. Run make check locally; only a repo admin can merge this PR."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
        env:
          UV_PYTHON: "3.13"
          UV_FROZEN: "1"
      - name: Run live integration tests
        run: make test-integration
        env:
          # Pin the interpreter and forbid lock rewrites for every `uv run` inside make.
          UV_PYTHON: "3.13"
          UV_FROZEN: "1"
