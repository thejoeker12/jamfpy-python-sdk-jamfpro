[build-system]
# 77 is the first release that reads the PEP 639 license fields below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jamfpy"
authors = [
    {name = "Joseph Little"},
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
version = "2.7.0"

dependencies = [
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "responses",
    "pylint",
    "mypy",
    "pyyaml",
    "types-pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jamfpy*"]

[tool.setuptools.package-data]
jamfpy = ["py.typed"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
# Suite uses the <name>_test.py convention; pytest defaults to test_*.py.
python_files = ["*_test.py"]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests are opt-in only; a CLI `-m integration` overrides this default.
addopts = "-m 'not integration'"
markers = [
    "integration: live min/max lifecycle tests against a real Jamf Pro tenant; deselected by default, run with `make test-integration`",
]
